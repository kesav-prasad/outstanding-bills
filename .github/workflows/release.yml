name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., git tag v1.0.2)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write # Important: Allow GitHub Actions to create a Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Cleanup previous duplicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset v1.0.3 "Outstanding.Bills.Setup.1.0.3.exe" -y -R kesav-prasad/outstanding-bills || true

      - name: Build and Publish App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win
